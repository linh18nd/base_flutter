name: base_flutter
description: "Flutter base project - Clean Architecture (Cubit/Bloc, get_it, go_router)."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  flex_color_scheme: ^9.0.0

  # State management
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.1

  # DI & routing
  get_it: ^9.3.0
  go_router: ^18.1.4

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Network
  dio: ^5.11.1
  retrofit: ^4.10.0

  # Storage
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  # i18n
  slang: ^4.19.2
  slang_flutter: ^4.19.0

  # Misc
  logger: ^2.8.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  retrofit_generator: ^10.3.3
  very_good_analysis: ^11.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

flutter:
  # Scheme mặc định trên iOS khi không truyền --flavor.
  default-flavor: dev
  uses-material-design: true
