include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/i18n/gen/**
    # Mason templates (mustache), not valid Dart until generated.
    - bricks/**

linter:
  rules:
    # App code, not a published package.
    public_member_api_docs: false
    # Dependencies in pubspec.yaml are grouped by purpose.
    sort_pub_dependencies: false
    # Dart 3.14 `new(...)` constructor syntax is still too new for most
    # docs/examples the team relies on; keep classic `ClassName(...)`.
    unnecessary_type_name_in_constructor: false
